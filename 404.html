<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka nenalezena — Za Vyskeř</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
  (() => {
    const saved = localStorage.getItem('zv-theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  })();
</script>
<style>
  .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem; }
  .nf__code { font-family: var(--font-display); font-size: clamp(5rem, 22vw, 11rem); line-height: .9; color: var(--brand); letter-spacing: -.04em; }
</style>
</head>
<body>
  <main class="nf">
    <div class="shell">
      <p class="nf__code">404</p>
      <h1 class="section__title" style="margin-top:.6rem">Tady nic není</h1>
      <p class="section__lead" style="margin-inline:auto">
        Stránku, kterou hledáte, jsme nenašli. Zkuste to od začátku — kandidáty najdete na hlavní stránce.
      </p>
      <p style="margin-top:2rem">
        <a class="btn btn--primary btn--lg" href="/">
          Zpět na úvod
          <svg viewBox="0 0 24 24" aria-hidden="true" class="btn__arrow"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
        </a>
      </p>
    </div>
  </main>
</body>
</html>
